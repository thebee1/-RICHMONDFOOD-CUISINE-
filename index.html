<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RICHMOND FOOD - Cuisine</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', serif; }
:root {
  --bg: #FAF7F0;
  --card: #FFFFFF;
  --dark: #1E2B22;
  --green: #2E5B3F;
  --gold: #C89B3C;
  --gold-light: #E8D5A8;
  --gray: #7A7A72;
  --line: #E7E0D2;
  --burgundy: #8C3B2E;
  --blue: #3D5A6C;
  --shadow: 0 2px 12px rgba(30,43,34,0.08);
  --shadow-lg: 0 12px 30px rgba(30,43,34,0.15);
}
body {
  background: var(--bg);
  color: var(--dark);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
header {
  background: var(--dark); color: var(--bg);
  border-bottom: 3px solid var(--gold);
  height: 75px; padding: 0 25px;
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0; z-index: 100;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 50px; height: 50px;
  background: var(--green); border: 2px solid var(--gold);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
}
.logo-text { font-size: 1.3rem; font-weight: 700; line-height: 1.1; letter-spacing: 2px; }
.logo-text span { color: var(--gold); }
.logo-sub {
  font-size: 0.72rem; color: var(--gold-light);
  font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase;
}
.header-center { display: flex; gap: 15px; align-items: center; }
.stat-badge {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 18px; border-radius: 8px;
  background: rgba(200,155,60,0.12);
  border: 1px solid rgba(200,155,60,0.35);
}
.stat-badge.preparing { background: rgba(200,155,60,0.18); border-color: var(--gold); }
.stat-badge.ready { background: rgba(46,91,63,0.25); border-color: var(--green); }
.stat-badge .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--gold);
  animation: pulse 2s infinite;
}
.stat-badge.preparing .dot { background: var(--gold-light); }
.stat-badge.ready .dot { background: #7BC496; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
.stat-badge .num { font-weight: 700; font-size: 1.2rem; color: var(--gold); }
.stat-badge.preparing .num { color: var(--gold-light); }
.stat-badge.ready .num { color: #7BC496; }
.stat-badge .label { font-size: 0.82rem; color: var(--bg); opacity: 0.75; font-weight: 600; }
.header-right { display: flex; gap: 12px; align-items: center; }
.clock {
  font-family: 'Consolas', monospace;
  font-size: 1.25rem; font-weight: 700; color: var(--gold-light);
  padding: 8px 15px; background: rgba(250,247,240,0.06);
  border-radius: 8px; border: 1px solid rgba(200,155,60,0.35);
}
.icon-btn {
  width: 45px; height: 45px;
  border: 1px solid rgba(200,155,60,0.35); background: transparent;
  border-radius: 8px; cursor: pointer;
  font-size: 1.2rem; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; color: var(--gold-light);
}
.icon-btn:hover {
  border-color: var(--gold); background: var(--gold); color: var(--dark);
}
.status-indicator {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 15px;
  background: rgba(46,91,63,0.3);
  border: 1px solid #7BC496;
  border-radius: 50px;
  font-size: 0.78rem; font-weight: 700;
  color: #7BC496;
  text-transform: uppercase; letter-spacing: 1px;
}
.status-indicator.offline {
  background: rgba(140,59,46,0.3);
  border-color: #D98D7E; color: #D98D7E;
}
.status-indicator .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: currentColor; animation: pulse 2s infinite;
}
.info-bar {
  background: var(--card); color: var(--dark);
  border-bottom: 1px solid var(--line);
  height: 45px; padding: 0 25px;
  display: flex; justify-content: space-between;
  align-items: center; font-size: 0.85rem; flex-shrink: 0;
}
.info-bar .left { display: flex; gap: 25px; }
.info-bar .right { display: flex; gap: 15px; color: var(--gray); }
.info-bar #refreshStatus { font-weight: 700; color: var(--green); }

/* BOARD & COLUMNS */
.board {
  flex: 1; padding: 15px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 15px; overflow: hidden; min-height: 0;
}
.column {
  background: var(--card);
  border-radius: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  display: flex; flex-direction: column;
  overflow: hidden;
  border-top: 4px solid;
  min-height: 0; max-height: 100%; height: 100%;
}
.column.new { border-top-color: var(--burgundy); }
.column.preparing { border-top-color: var(--gold); }
.column.ready { border-top-color: var(--green); }
.column.delivering { border-top-color: var(--blue); }
.column-header {
  padding: 15px 20px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.column-title { display: flex; align-items: center; gap: 10px; }
.column-icon { font-size: 1.4rem; }
.column-title-text { font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.column.new .column-title-text { color: var(--burgundy); }
.column.preparing .column-title-text { color: var(--gold); }
.column.ready .column-title-text { color: var(--green); }
.column.delivering .column-title-text { color: var(--blue); }
.column-count {
  background: var(--bg); color: var(--dark);
  padding: 4px 14px; border-radius: 8px;
  font-weight: 700; font-size: 0.9rem;
}
.column.new .column-count { background: #F7E9E5; color: var(--burgundy); }
.column.preparing .column-count { background: #FCF5E3; color: var(--gold); }
.column.ready .column-count { background: #EAF3EC; color: var(--green); }
.column.delivering .column-count { background: #E8EEF2; color: var(--blue); }

/* SCROLL AREA */
.column-body {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 12px; display: flex; flex-direction: column;
  gap: 12px; min-height: 0;
  scroll-behavior: smooth; overscroll-behavior: contain;
}
.column-body::-webkit-scrollbar { width: 10px; }
.column-body::-webkit-scrollbar-track { background: var(--bg); border-radius: 5px; }
.column-body::-webkit-scrollbar-thumb {
  background: var(--gold); border-radius: 5px;
}
.column-body::-webkit-scrollbar-thumb:hover { background: var(--green); }

/* INDICATEUR DE SCROLL */
.scroll-hint {
  text-align: center; padding: 5px;
  color: var(--gray); font-size: 0.75rem; font-weight: 600;
  opacity: 0.7; flex-shrink: 0;
  border-top: 1px dashed var(--line);
  background: var(--bg);
}

/* ORDER CARD */
.order-card {
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--line);
  display: flex; flex-direction: column;
  transition: all 0.3s;
  animation: slideIn 0.4s ease;
  position: relative; overflow: hidden;
  flex-shrink: 0;
}
.order-card::before {
  content: ''; position: absolute;
  left: 0; top: 0; bottom: 0; width: 4px;
}
.order-card.new::before { background: var(--burgundy); }
.order-card.preparing::before { background: var(--gold); }
.order-card.ready::before { background: var(--green); }
.order-card.delivering::before { background: var(--blue); }
.order-card:hover { box-shadow: var(--shadow-lg); border-color: var(--gold); }
.order-card.urgent { border-color: var(--burgundy); }
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* CONTENU SCROLLABLE DE LA CARTE */
.order-content {
  padding: 12px 12px 0 12px;
  overflow-y: auto; max-height: 280px; min-height: 0;
  flex: 1 1 auto;
}
.order-content::-webkit-scrollbar { width: 6px; }
.order-content::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.order-header {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 10px;
  padding-bottom: 10px; border-bottom: 1px dashed var(--line);
}
.order-number { font-size: 1.1rem; font-weight: 700; color: var(--dark); line-height: 1.2; }
.order-source {
  font-size: 0.65rem; padding: 3px 8px; border-radius: 6px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
}
.source-website { background: #E8EEF2; color: var(--blue); }
.source-whatsapp { background: #EAF3EC; color: var(--green); }
.order-time {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.75rem; color: var(--gray); margin-bottom: 8px; font-weight: 600;
}
.order-time.urgent { color: var(--burgundy); font-weight: 700; }
.order-customer {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; background: var(--bg);
  border-radius: 8px; margin-bottom: 8px;
  font-size: 0.85rem; font-weight: 700;
}
.order-contact {
  font-size: 0.75rem; color: var(--gray);
  margin-bottom: 8px; line-height: 1.4;
}
.order-contact strong { color: var(--dark); }
.order-items {
  background: var(--bg); border-radius: 8px;
  padding: 8px 10px; margin-bottom: 8px;
  border: 1px solid var(--line);
}
.order-item {
  display: flex; justify-content: space-between;
  align-items: flex-start; padding: 4px 0; font-size: 0.85rem;
}
.order-item:not(:last-child) { border-bottom: 1px solid var(--line); }
.item-left { display: flex; gap: 8px; align-items: flex-start; flex: 1; }
.item-qty {
  background: var(--green); color: var(--bg);
  font-weight: 700; padding: 1px 8px; border-radius: 6px;
  font-size: 0.75rem; min-width: 28px; text-align: center;
}
.item-name { font-weight: 600; color: var(--dark); flex: 1; }
.item-notes { font-size: 0.7rem; color: var(--burgundy); font-style: italic; margin-top: 2px; }
.order-total {
  display: flex; justify-content: space-between;
  align-items: center; padding: 8px 0;
  border-top: 2px solid var(--gold-light); margin-bottom: 8px;
}
.order-total-label { font-size: 0.75rem; color: var(--gray); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.order-total-value { font-size: 1.05rem; font-weight: 700; color: var(--green); }
.order-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.meta-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; background: var(--bg);
  border-radius: 6px; font-size: 0.7rem;
  font-weight: 700; color: var(--dark);
  border: 1px solid var(--line);
}
.order-notes {
  background: #F7E9E5; color: var(--burgundy);
  padding: 8px; border-radius: 8px; margin-bottom: 8px;
  font-size: 0.8rem; border-left: 3px solid var(--burgundy);
  font-weight: 600;
}

/* BOUTONS STICKY */
.order-actions {
  display: flex; gap: 8px;
  padding: 10px 12px;
  background: var(--card);
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
  position: sticky; bottom: 0; z-index: 10;
  box-shadow: 0 -4px 10px rgba(30,43,34,0.06);
  flex-shrink: 0;
}
.btn-action {
  flex: 1; min-width: 110px;
  padding: 14px 10px;
  border: none; border-radius: 8px;
  font-weight: 700; font-size: 0.8rem;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  gap: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  font-family: inherit;
}
.btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(30,43,34,0.2); }
.btn-action:active { transform: translateY(0); }
.btn-action:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-start { background: var(--gold); color: var(--dark); }
.btn-ready { background: var(--green); color: var(--bg); }
.btn-deliver { background: var(--blue); color: #fff; }
.btn-back { background: var(--bg); color: var(--dark); flex: 0 0 50px; min-width: 50px; padding: 14px 5px; border: 1px solid var(--line); }
.btn-back:hover { background: var(--line); }
.btn-confirm { background: var(--dark); color: var(--gold-light); }
.btn-delete { background: var(--gray); color: #fff; flex: 0 0 50px; min-width: 50px; padding: 14px 5px; }
.btn-delete:hover { background: var(--burgundy); }

.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--gray); padding: 40px 20px; text-align: center;
}
.empty-icon { font-size: 3rem; opacity: 0.25; margin-bottom: 15px; }
.empty-text { font-size: 0.9rem; font-weight: 600; }

/* ALERT, TOAST, LOADING */
.alert-overlay {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, rgba(30,43,34,0.98), rgba(46,91,63,0.98));
  z-index: 9999; display: none;
  flex-direction: column; align-items: center; justify-content: center;
  color: var(--bg); text-align: center;
}
.alert-overlay.show { display: flex; animation: alertIn 0.5s ease; }
@keyframes alertIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
.alert-icon { font-size: 8rem; margin-bottom: 20px; animation: bounce 0.8s infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-25px); } }
.alert-title { font-size: 3.5rem; font-weight: 700; margin-bottom: 15px; letter-spacing: 4px; color: var(--gold-light); }
.alert-text { font-size: 1.5rem; opacity: 0.9; margin-bottom: 40px; font-weight: 600; }
.alert-close {
  padding: 18px 50px; background: var(--gold); color: var(--dark);
  border: none; border-radius: 8px; font-size: 1.1rem;
  font-weight: 700; cursor: pointer; transition: all 0.2s;
  letter-spacing: 1px; text-transform: uppercase;
}
.alert-close:hover { background: var(--gold-light); transform: scale(1.05); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--dark); color: var(--bg);
  padding: 15px 30px; border-radius: 8px;
  font-weight: 700; box-shadow: var(--shadow-lg);
  opacity: 0; transition: all 0.3s; z-index: 1000;
  border-left: 4px solid var(--gold);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { background: var(--green); border-left-color: var(--gold); }
.toast.error { background: var(--burgundy); border-left-color: var(--gold-light); }
.loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10000; transition: opacity 0.5s;
}
.loading.hide { opacity: 0; pointer-events: none; }
.spinner {
  width: 60px; height: 60px;
  border: 5px solid var(--line); border-top-color: var(--green);
  border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--dark); font-weight: 700; font-size: 1.1rem; }

@media (max-width: 1300px) { .board { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 1000px) { .board { grid-template-columns: repeat(2, 1fr); } .header-center { display: none; } }
@media (max-width: 700px) {
  body { height: 100dvh; overflow: hidden; }
  header { height: auto; min-height: 64px; padding: 8px 12px; gap: 8px; }
  .logo { gap: 8px; }
  .logo-icon { width: 42px; height: 42px; font-size: 1.5rem; }
  .logo-text { font-size: 1rem; }
  .logo-sub { display: none; }
  .header-right { gap: 6px; margin-left: auto; }
  .header-right .status-indicator, .clock { display: none; }
  .icon-btn { width: 42px; height: 42px; }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 10px; overflow-y: auto; overflow-x: hidden; }
  .column { height: auto; min-height: 52dvh; max-height: 70dvh; border-radius: 10px; }
  .column-header { padding: 12px 14px; }
  .column-title-text { font-size: 0.8rem; }
  .column-body { padding: 8px; gap: 8px; }
  .order-card { border-radius: 8px; }
  .order-content { max-height: 240px; padding: 10px 10px 0; }
  .order-actions { padding: 8px; gap: 6px; }
  .btn-action { min-height: 48px; min-width: 0; padding: 12px 8px; font-size: 0.72rem; }
  .btn-back, .btn-delete { flex: 0 0 48px; min-width: 48px; }
  .info-bar { height: auto; min-height: 45px; padding: 8px 15px; gap: 8px; flex-wrap: wrap; }
  .info-bar .left, .info-bar .right { gap: 10px; flex-wrap: wrap; }
  .info-bar .right { font-size: 0.75rem; }
}

@media (max-width: 420px) {
  .logo-text { font-size: 0.9rem; }
  .header-right .icon-btn { width: 38px; height: 38px; font-size: 1rem; }
  .info-bar { font-size: 0.75rem; }
  .info-bar .right #lastUpdate { display: none; }
  .column { min-height: 58dvh; max-height: 76dvh; }
  .order-number { font-size: 1rem; }
  .order-customer { font-size: 0.8rem; }
  .btn-action { font-size: 0.66rem; letter-spacing: 0; }
}
</style>

<script>
let CONFIG = {
  restaurant: { name: 'RICHMOND FOOD', tagline: 'Tableau de Bord Cuisine', logo: '🍽️' },
  webhook: { get_orders: '', update_status: '' },
  refresh_interval_seconds: 15,
  sound_alerts: true,
  auto_refresh: false,
  urgent_after_minutes: 15
};

const STATUSES = [
  { id: 'new', label: 'Nouvelles', icon: '🆕' },
  { id: 'preparing', label: 'En préparation', icon: '👨‍🍳' },
  { id: 'ready', label: 'Prêtes', icon: '✅' },
  { id: 'delivering', label: 'En livraison', icon: '🛵' }
];

let orders = [];
let previousOrderIds = new Set();
const STATUS_OVERRIDES_KEY = 'richmond_food_status_overrides';
let statusOverrides = loadStatusOverrides();
let soundEnabled = true;
let clockTimer = null;
let refreshTimer = null;
let isFetchingOrders = false;
let firstLoad = true;

function loadStatusOverrides() {
  try {
    return JSON.parse(localStorage.getItem(STATUS_OVERRIDES_KEY) || '{}');
  } catch (e) {
    return {};
  }
}

function saveStatusOverrides() {
  localStorage.setItem(STATUS_OVERRIDES_KEY, JSON.stringify(statusOverrides));
}

function getOrderKey(order) {
  return String(order.order_number || order.id || '');
}

function applyStatusOverrides(serverOrders) {
  let overridesChanged = false;
  const mergedOrders = serverOrders.map(order => {
    const key = getOrderKey(order);
    const override = statusOverrides[key];
    const serverStatus = order.state || order.status;

    if (!override) return order;
    if (serverStatus === override) {
      delete statusOverrides[key];
      overridesChanged = true;
      return order;
    }

    return { ...order, state: override };
  });

  if (overridesChanged) saveStatusOverrides();
  return mergedOrders;
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadConfig();
  startClock();
  renderBoard();
  fetchOrders();
  startAutoRefresh();
  setTimeout(() => document.getElementById('loading').classList.add('hide'), 800);
  soundEnabled = CONFIG.sound_alerts;
  updateSoundBtn();
});

async function loadConfig() {
  try {
    const r = await fetch('./menu-data.json');
    const data = await r.json();
    CONFIG = { ...CONFIG, ...data };
    console.log('✅ Config chargée');
    console.log('🔄 Auto-refresh :', CONFIG.auto_refresh ? 'ACTIVÉ' : 'DÉSACTIVÉ');
  } catch (e) {
    console.warn('Config par défaut utilisée');
  }
}

function startClock() {
  updateClock();
  clockTimer = setInterval(updateClock, 1000);
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  document.getElementById('infoTime').textContent = `${h}:${m}`;
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);

  const intervalSeconds = Number(CONFIG.refresh_interval_seconds) || 15;
  const refreshStatus = document.getElementById('refreshStatus');

  if (!CONFIG.auto_refresh) {
    refreshStatus.textContent = '🔄 Mode manuel — cliquez sur 🔄 pour actualiser';
    return;
  }

  refreshStatus.textContent = `🔄 Actualisation automatique : ${intervalSeconds}s`;
  refreshTimer = setInterval(fetchOrders, intervalSeconds * 1000);
}

async function manualRefresh() {
  showToast('🔄 Rafraîchissement...', 'success');
  await fetchOrders();
}

async function fetchOrders() {
  if (isFetchingOrders) return;
  isFetchingOrders = true;
  const url = CONFIG.webhook.get_orders;
  if (!url) {
    setOnline(false);
    isFetchingOrders = false;
    return;
  }
  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'get_orders' })
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    const newOrders = Array.isArray(data) ? data : (data.orders || data.data || []);
    if (!firstLoad) detectNewOrders(newOrders);
    firstLoad = false;
    orders = applyStatusOverrides(newOrders);
    renderBoard();
    setOnline(true);
    document.getElementById('lastUpdate').textContent = 'Dernière MAJ : ' + new Date().toLocaleTimeString('fr-FR');
  } catch (e) {
    console.error(e);
    setOnline(false);
  } finally {
    isFetchingOrders = false;
  }
}

function detectNewOrders(newOrders) {
  const currentIds = new Set(newOrders.map(o => o.id || o.order_number));
  for (const id of currentIds) {
    if (!previousOrderIds.has(id)) {
      const order = newOrders.find(o => (o.id || o.order_number) === id);
      if (order && (order.state === 'new' || !order.state)) {
        onNewOrder(order);
      }
    }
  }
  previousOrderIds = currentIds;
}

function onNewOrder(order) {
  document.getElementById('alertText').textContent = `#${order.order_number} • ${order.customer_name || 'Client'}`;
  document.getElementById('alertOverlay').classList.add('show');
  if (soundEnabled) playSound();
  if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
}

function playSound() {
  try {
    const audio = document.getElementById('notifSound');
    audio.currentTime = 0; audio.volume = 1;
    audio.play().catch(() => {});
  } catch (e) {}
}

function closeAlert() {
  document.getElementById('alertOverlay').classList.remove('show');
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = STATUSES.map(status => {
    const statusOrders = orders.filter(o => (o.state || o.status || 'new') === status.id);
    const hasMany = statusOrders.length > 2;

    return `
      <div class="column ${status.id}">
        <div class="column-header">
          <div class="column-title">
            <span class="column-icon">${status.icon}</span>
            <span class="column-title-text">${status.label}</span>
          </div>
          <div class="column-count">${statusOrders.length}</div>
        </div>
        <div class="column-body" id="col-${status.id}">
          ${statusOrders.length === 0
            ? `<div class="empty-state"><div class="empty-icon">${status.icon}</div><div class="empty-text">Aucune commande</div></div>`
            : statusOrders.map(o => renderOrderCard(o, status)).join('')}
        </div>
        ${hasMany ? `<div class="scroll-hint">↕ Faites défiler pour voir les ${statusOrders.length} commandes</div>` : ''}
      </div>`;
  }).join('');
  updateStats();
}

function renderOrderCard(order, status) {
  const orderNum = order.order_number || order.id || 'N/A';
  const customer = order.customer_name || 'Client';
  const source = order.source || 'website';
  const sourceLabel = source === 'website' ? '🌐 WEB' : '📱 WHATSAPP';
  const sourceClass = source === 'website' ? 'source-website' : 'source-whatsapp';
  const timeSince = getTimeSince(order.create_date || order.order_date);
  const isUrgent = timeSince.minutes > (CONFIG.urgent_after_minutes || 15) && status.id !== 'ready';
  const items = order.items || order.order_lines || [];
  const itemsHtml = items.map(i => `
    <div class="order-item">
      <div class="item-left">
        <span class="item-qty">${i.quantity || i.qty || 1}x</span>
        <div style="flex:1;">
          <div class="item-name">${i.dish_name || i.name || 'Article'}</div>
          ${i.notes ? `<div class="item-notes">📝 ${i.notes}</div>` : ''}
        </div>
      </div>
    </div>`).join('');

  let actions = '';
  if (status.id === 'new') {
    actions = `<button class="btn-action btn-confirm" onclick="confirmOrder('${orderNum}', this)">✅ Confirmer la commande</button>`;
  } else if (status.id === 'preparing') {
    actions = `
      <button class="btn-action btn-ready" onclick="updateStatus('${orderNum}', 'ready', this)">✅ Confirmer la préparation</button>
      <button class="btn-action btn-back" onclick="updateStatus('${orderNum}', 'new', this)">↩</button>
    `;
  } else if (status.id === 'ready') {
    actions = `
      <button class="btn-action btn-deliver" onclick="updateStatus('${orderNum}', 'delivering', this)">🛵 Envoyer en livraison</button>
      <button class="btn-action btn-back" onclick="updateStatus('${orderNum}', 'preparing', this)">↩</button>
    `;
  } else if (status.id === 'delivering') {
    actions = `<button class="btn-action btn-confirm" onclick="updateStatus('${orderNum}', 'delivered', this)">✅ Confirmer la livraison</button>`;
  }

  actions += `<button class="btn-action btn-delete" onclick="deleteOrder('${orderNum}', this)" title="Supprimer la commande" aria-label="Supprimer la commande">🗑️</button>`;

  const payment = order.payment_method ? order.payment_method.toUpperCase() : '';

  return `
    <div class="order-card ${status.id} ${isUrgent ? 'urgent' : ''}">
      <div class="order-content">
        <div class="order-header">
          <div class="order-number">#${orderNum}</div>
          <div class="order-source ${sourceClass}">${sourceLabel}</div>
        </div>
        <div class="order-time ${isUrgent ? 'urgent' : ''}">
          <span>⏱️</span><span>Il y a ${timeSince.text}</span>${isUrgent ? '<span>⚠️</span>' : ''}
        </div>
        <div class="order-customer"><span>👤</span><span>${customer}</span></div>
        ${order.customer_phone || order.customer_address ? `<div class="order-contact">${order.customer_phone ? `📞 <strong>${order.customer_phone}</strong><br>` : ''}${order.customer_address ? `📍 ${order.customer_address}` : ''}</div>` : ''}
        <div class="order-items">${itemsHtml || '<div style="text-align:center;color:#999;padding:10px;font-size:0.8rem;">Aucun article</div>'}</div>
        <div class="order-total"><span class="order-total-label">Total</span><span class="order-total-value">${(order.total || 0).toLocaleString()} F</span></div>
        ${payment || order.delivery_time ? `<div class="order-meta">${payment ? `<span class="meta-tag">💳 ${payment}</span>` : ''}${order.delivery_time && order.delivery_time !== 'asap' ? `<span class="meta-tag">🕐 ${order.delivery_time}</span>` : ''}</div>` : ''}
        ${order.notes && !order.notes.includes('Commande WhatsApp') ? `<div class="order-notes">📝 ${order.notes}</div>` : ''}
      </div>
      <div class="order-actions">${actions}</div>
    </div>`;
}

function getTimeSince(dateStr) {
  if (!dateStr) return { text: 'N/A', minutes: 0 };
  const diffMins = Math.floor((new Date() - new Date(dateStr)) / 60000);
  if (diffMins < 1) return { text: '< 1 min', minutes: 0 };
  if (diffMins < 60) return { text: `${diffMins} min`, minutes: diffMins };
  const hours = Math.floor(diffMins / 60);
  const mins = diffMins % 60;
  return { text: `${hours}h${mins > 0 ? mins + 'min' : ''}`, minutes: diffMins };
}

function updateStats() {
  const getStatus = order => order.state || order.status || 'new';
  document.getElementById('statNew').textContent = orders.filter(o => getStatus(o) === 'new').length;
  document.getElementById('statPrep').textContent = orders.filter(o => getStatus(o) === 'preparing').length;
  document.getElementById('statReady').textContent = orders.filter(o => getStatus(o) === 'ready').length;
  document.getElementById('infoTotal').textContent = orders.length;
}

async function confirmOrder(orderNumber, btn) {
  if (!confirm(`Confirmer la commande #${orderNumber} ?\n\nElle passera en préparation.`)) return;
  if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }

  try {
    const url = CONFIG.webhook.update_status;
    if (!url) throw new Error('URL non configurée');
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_number: orderNumber, state: 'preparing' })
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    await response.text();
    statusOverrides[String(orderNumber)] = 'preparing';
    saveStatusOverrides();
    showToast(`✅ Commande #${orderNumber} → En préparation`, 'success');
    await fetchOrders();
  } catch (e) {
    console.error(e);
    showToast(`❌ Erreur`, 'error');
    await fetchOrders();
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

async function deleteOrder(orderNumber, btn) {
  if (!confirm(`Supprimer définitivement la commande #${orderNumber} ?`)) return;
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }

  try {
    const url = CONFIG.webhook.update_status;
    if (!url) throw new Error('URL non configurée');
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'delete_order',
        order_number: orderNumber,
        state: 'deleted'
      })
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    await response.text();

    delete statusOverrides[String(orderNumber)];
    saveStatusOverrides();
    orders = orders.filter(order => getOrderKey(order) !== String(orderNumber));
    renderBoard();
    showToast(`🗑️ Commande #${orderNumber} supprimée`, 'success');
  } catch (e) {
    console.error(e);
    showToast('❌ Impossible de supprimer la commande', 'error');
    if (btn) { btn.disabled = false; btn.textContent = '🗑️'; }
  }
}

async function updateStatus(orderNumber, newStatus, btn) {
  const messages = {
    preparing: `Confirmer la commande #${orderNumber} ?`,
    ready: `La commande #${orderNumber} est-elle prête ?`,
    delivering: `Envoyer la commande #${orderNumber} en livraison ?`,
    delivered: `Confirmer la livraison de #${orderNumber} ?`,
    new: `Remettre la commande #${orderNumber} en nouvelle ?`
  };
  if (!confirm(messages[newStatus] || `Changer le statut ?`)) return;
  if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }

  try {
    const url = CONFIG.webhook.update_status;
    if (!url) throw new Error('URL non configurée');
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_number: orderNumber, state: newStatus })
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    await response.text();
    statusOverrides[String(orderNumber)] = newStatus;
    saveStatusOverrides();
    const labels = { preparing: 'En préparation', ready: 'Prête', delivering: 'En livraison', delivered: 'Livrée', new: 'Nouvelle' };
    showToast(`✅ #${orderNumber} → ${labels[newStatus] || newStatus}`, 'success');
    await fetchOrders();
  } catch (e) {
    console.error(e);
    showToast(`❌ Erreur`, 'error');
    await fetchOrders();
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

function setOnline(online) {
  const badge = document.getElementById('statusBadge');
  const text = document.getElementById('statusText');
  const lastUpdate = document.getElementById('lastUpdate');
  if (online) {
    badge.classList.remove('offline');
    text.textContent = 'En ligne';
  } else {
    badge.classList.add('offline');
    text.textContent = 'Hors ligne';
    lastUpdate.textContent = 'Connexion indisponible — nouvelle tentative automatique';
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  updateSoundBtn();
  showToast(soundEnabled ? '🔊 Son activé' : '🔇 Son coupé', 'success');
}

function updateSoundBtn() {
  document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'F5') { e.preventDefault(); manualRefresh(); }
  if (e.key === 'Escape') closeAlert();
  if (e.ctrlKey && e.key === 'f') { e.preventDefault(); toggleFullscreen(); }
});
</script>
</body>
</html>
